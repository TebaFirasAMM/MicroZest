<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">MicroZest - منصة تخمير قشور الفواكه الحيوية</title>
    <style>
        body { font-family: Tahoma, sans-serif; background-color: #f4f9f5; color: #1f2d24; margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1100px; margin: 0 auto; background: #ffffff; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); overflow: hidden; border: 1px solid #c8e6c9; }
        
        header { background: #1b4332; color: white; padding: 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-content h1 { margin: 0; font-size: 1.8rem; }
        .header-content p { margin: 5px 0 0; font-size: 0.9rem; opacity: 0.85; }
        
        /* زر اللغة بتصميم متناسق */
        .lang-btn { background: #2d6a4f; color: white; border: 1px solid #52b788; padding: 8px 16px; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 0.9rem; transition: 0.2s; }
        .lang-btn:hover { background: #52b788; }

        .content { display: flex; gap: 20px; padding: 25px; flex-wrap: wrap; justify-content: center; }
        .card { background: #fafdfa; border: 1px solid #c8e6c9; border-radius: 12px; padding: 20px; width: 320px; box-shadow: 0 2px 8px rgba(0,0,0,0.03); }
        .card h3 { color: #1b4332; margin-top: 0; border-bottom: 2px solid #e8f5e9; padding-bottom: 8px; }
        
        .peels-list { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 15px; }
        .peel-btn { background: #fff; border: 2px solid #2d6a4f; padding: 8px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; color: #2d6a4f; transition: 0.2s; }
        .peel-btn.active { background: #2d6a4f; color: white; }
        
        input[type="date"], select { width: 100%; padding: 10px; margin-top: 10px; border: 1px solid #c8e6c9; border-radius: 8px; font-family: Tahoma, sans-serif; }
        .result-box { margin-top: 15px; background: #e8f5e9; padding: 12px; border-radius: 8px; font-weight: bold; color: #1b4332; text-align: center; }
        
        /* صندوق الملاحظة والتنبيه التفاعلي عند اختيار الفواكه */
        .alert-box { margin-top: 12px; background: #e8f5e9; border: 1px solid #b7e4c7; color: #1b4332; padding: 10px; border-radius: 8px; font-size: 0.85rem; display: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="header-content">
                <h1 id="mainTitle">MicroZest 🌿</h1>
                <p id="subTitle">منصة ذكية لتحليل وتتبع تخمير قشور الفواكه الحيوية</p>
            </div>
            <button class="lang-btn" onclick="toggleLanguage()" id="langToggleBtn">English</button>
        </header>

        <div class="content">
            <!-- الخطوة 1 -->
            <div class="card">
                <h3 id="step1Title">1. اختر نوع القشور</h3>
                <p style="font-size: 0.85rem; color: #555;" id="step1Desc">انقر لتحديد القشور المستخدمة:</p>
                <div class="peels-list">
                    <button class="peel-btn active" onclick="selectPeel(this, 'برتقال', 'Orange')">🍊 برتقال</button>
                    <button class="peel-btn active" onclick="selectPeel(this, 'ليمون', 'Lemon')">🍋 ليمون</button>
                    <button class="peel-btn" onclick="selectPeel(this, 'تفاح', 'Apple')">🍎 تفاح</button>
                    <button class="peel-btn" onclick="selectPeel(this, 'موز', 'Banana')">🍌 موز</button>
                </div>
                <div class="alert-box" id="peelAlert"></div>
            </div>

            <!-- الخطوة 2 -->
            <div class="card">
                <h3 id="step2Title">2. تاريخ بدء التخمير</h3>
                <p style="font-size: 0.85rem; color: #555;" id="step2Desc">حدد تاريخ بدء العمل في المختبر:</p>
                <input type="date" id="dateInput" onchange="calculateDays()">
                <div class="result-box" id="daysResult">الأيام المنقضية: 3 أيام</div>
            </div>

            <!-- الخطوة 3 -->
            <div class="card">
                <h3 id="step3Title">3. متابعة التخمير</h3>
                <p style="font-size: 0.85rem; color: #555;" id="step3Desc">الملاحظات الحيوية للتفاعل:</p>
                <label style="font-size: 0.8rem; font-weight: bold;" id="appearanceLabel">المظهر العام:</label>
                <select id="appearance">
                    <option id="opt1">ظهور فقاعات غازية خفيفة وتصاعد تدريجي</option>
                    <option id="opt2">تفاعل نشط وتصاعد فقاعات مستمر</option>
                    <option id="opt3">اكتمال النضج وتصفية المحلول الحيوي</option>
                </select>
                
                <label style="font-size: 0.8rem; font-weight: bold; display:block; margin-top:10px;" id="scentLabel">الرائحة المتكونة:</label>
                <select id="scent">
                    <option id="scent1">رائحة حمضيات قوية ونقية</option>
                    <option id="scent2">رائحة خل ومركزات قوية جاهزة للاستخدام</option>
                </select>
            </div>
        </div>
    </div>

    <script>
        let currentLang = 'ar';

        // ضبط تاريخ افتراضي قبل 3 أيام لضمان ظهور النتائج فوراً
        const d = new Date();
        d.setDate(d.getDate() - 3);
        document.getElementById('dateInput').valueAsDate = d;

        function calculateDays() {
            const val = document.getElementById('dateInput').value;
            if(!val) return;
            const start = new Date(val);
            const now = new Date();
            const diff = Math.floor((now - start) / (1000 * 60 * 60 * 24));
            const daysText = currentLang === 'ar' ? "الأيام المنقضية: " : "Elapsed Days: ";
            const daysSuffix = currentLang === 'ar' ? " أيام" : " days";
            document.getElementById('daysResult').innerText = daysText + (diff >= 0 ? diff : 0) + daysSuffix;
        }

        // دالة تفاعلية عند النقر على الفواكه لإعطاء ملاحظة فورية
        function selectPeel(btn, arName, enName) {
            btn.classList.toggle('active');
            const isActive = btn.classList.contains('active');
            const name = currentLang === 'ar' ? arName : enName;
            
            const alertBox = document.getElementById('peelAlert');
            alertBox.style.display = 'block';
            
            if (isActive) {
                alertBox.innerText = currentLang === 'ar' 
                    ? ✓ تم تفعيل استخدام قشور الـ ${name} في خطة التخمير. 
                    : ✓ ${name} peels activated in fermentation plan.;
            } else {
                alertBox.innerText = currentLang === 'ar' 
                    ? ✗ تم استبعاد قشور الـ ${name} من التخمير. 
                    : ✗ ${name} peels removed from fermentation.;
            }
        }

        // دالة تبديل اللغة (عربي / إنجليزي) بدون تغيير الشكل الأصلي
        function toggleLanguage() {
            const htmlRoot = document.getElementById('htmlRoot');
            const langBtn = document.getElementById('langToggleBtn');

            if (currentLang === 'ar') {
                currentLang = 'en';
                htmlRoot.setAttribute('lang', 'en');
                htmlRoot.setAttribute('dir', 'ltr');
                langBtn.innerText = 'عربي';

                document.getElementById('pageTitle').innerText = "MicroZest - Bio Fruit Peels Fermentation Platform";
                document.getElementById('mainTitle').innerText = "MicroZest 🌿";
                document.getElementById('subTitle').innerText = "Smart platform for analyzing and tracking bio fruit peel fermentation";
                document.getElementById('step1Title').innerText = "1. Choose Peels";
                document.getElementById('step1Desc').innerText = "Click to select used peels:";
                
                document.getElementById('step2Title').innerText = "2. Fermentation Start Date";
                document.getElementById('step2Desc').innerText = "Select lab work start date:";
                
                document.getElementById('step3Title').innerText = "3. Fermentation Tracking";
                document.getElementById('step3Desc').innerText = "Bio-interaction notes:";
                document.getElementById('appearanceLabel').innerText = "General Appearance:";
                
                document.getElementById('opt1').innerText = "Light gas bubbles and gradual rise";
                document.getElementById('opt2').innerText = "Active reaction and continuous bubbles";
                document.getElementById('opt3').innerText = "Maturity complete and bio-solution filtered";
                
                document.getElementById('scentLabel').innerText = "Generated Scent:";
                document.getElementById('scent1').innerText = "Strong and pure citrus scent";
                document.getElementById('scent2').innerText = "Strong vinegar scent ready for use";
                
                calculateDays();
            } else {
                currentLang = 'ar';
                htmlRoot.setAttribute('lang', 'ar');
                htmlRoot.setAttribute('dir', 'rtl');
                langBtn.innerText = 'English';

                document.getElementById('pageTitle').innerText = "MicroZest - منصة تخمير قشور الفواكه الحيوية";
                document.getElementById('mainTitle').innerText = "MicroZest 🌿";
                document.getElementById('subTitle').innerText = "منصة ذكية لتحليل وتتبع تخمير قشور الفواكه الحيوية";
                
                document.getElementById('step1Title').innerText = "1. اختر نوع القشور";
                document.getElementById('step1Desc').innerText = "انقر لتحديد القشور المستخدمة:";
                
                document.getElementById('step2Title').innerText = "2. تاريخ بدء التخمير";
                document.getElementById('step2Desc').innerText = "حدد تاريخ بدء العمل في المختبر:";
                
                document.getElementById('step3Title').innerText = "3. متابعة التخمير";
                document.getElementById('step3Desc').innerText = "الملاحظات الحيوية للتفاعل:";
                document.getElementById('appearanceLabel').innerText = "المظهر العام:";
                
                document.getElementById('opt1').innerText = "ظهور فقاعات غازية خفيفة وتصاعد تدريجي";
                document.getElementById('opt2').innerText = "تفاعل نشط وتصاعد فقاعات مستمر";
                document.getElementById('opt3').innerText = "اكتمال النضج وتصفية المحلول الحيوي";
                
                document.getElementById('scentLabel').innerText = "الرائحة المتكونة:";
                document.getElementById('scent1').innerText = "رائحة حمضيات قوية ونقية";
                document.getElementById('scent2').innerText = "رائحة خل ومركزات قوية جاهزة للاستخدام";
                
                calculateDays();
            }
        }
    </script>
</body>
</html>
